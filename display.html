<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>VIS Live Crowd · Display</title>
<style>
  :root { color-scheme: dark; --ink: #121110; --ivory: #f4f2ec; --muted: #8f8b85; --lav: #c29af6; --line: #2b2927; }
  [hidden] { display: none !important; }
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; cursor: none; }
  body.cursor { cursor: default; }
  canvas { position: absolute; inset: 0; margin: auto; width: min(100vw, calc(100vh * 16 / 9)); height: min(100vh, calc(100vw * 9 / 16)); display: block; }
  #status { position: absolute; left: 16px; bottom: 16px; font: 13px/1.5 ui-monospace, Menlo, monospace; color: var(--ivory); background: rgba(18,17,16,.92); border: 1px solid var(--line); padding: 10px 14px; white-space: pre; }
  #status b { color: var(--lav); font-weight: 500; }
  #start { position: absolute; inset: 0; display: grid; place-items: center; background: var(--ink); color: var(--ivory); font: 14px/1.6 ui-monospace, Menlo, monospace; text-align: center; cursor: default; }
  #start button { margin-top: 18px; font: 500 13px ui-monospace, Menlo, monospace; letter-spacing: .08em; text-transform: uppercase; color: var(--ink); background: var(--lav); border: 0; padding: 12px 18px; cursor: pointer; }
  #start p { color: var(--muted); margin: 6px 0; }
</style>
</head>
<body>
<canvas id="c" width="1920" height="1080" aria-label="Live seat map of the room"></canvas>
<div id="status" hidden></div>
<div id="start">
  <div>
    <div>VIS live crowd · display</div>
    <p id="codeLine"></p>
    <p>Press <b>F</b> for fullscreen, <b>S</b> to show or hide status, <b>R</b> to reset the room.</p>
    <button type="button" id="go">Go fullscreen</button>
  </div>
</div>
<script src="vendor/peerjs-1.5.4.min.js?v=7"></script>
<script type="module" src="display.js?v=7"></script>
</body>
</html>
